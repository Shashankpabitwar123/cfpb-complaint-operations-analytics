version: 2

models:
  - name: stg_complaints
    description: Standardized CFPB complaints in the full-year 2023-2025 analysis window.
    columns:
      - name: complaint_id
        tests: [not_null, unique]
      - name: date_received
        tests: [not_null]
      - name: timely_response
        tests:
          - accepted_values:
              arguments:
                values: ['Yes', 'No', 'Unknown']
  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]
  - name: dim_company
    columns:
      - name: company_name
        tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product
        tests: [not_null]
      - name: sub_product
        tests: [not_null]
  - name: dim_state
    columns:
      - name: state_code
        tests: [not_null, unique]
  - name: fct_complaints
    description: One valid published CFPB complaint per Complaint ID.
    columns:
      - name: complaint_id
        tests: [not_null, unique]
      - name: date_received
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: company_name
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_name
      - name: state_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_code
  - name: mart_monthly_operations
    columns:
      - name: month_start
        tests: [not_null, unique]
      - name: complaint_volume
        tests: [not_null]
  - name: mart_data_quality_reconciliation
    columns:
      - name: check_name
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['PASS', 'FAIL']
